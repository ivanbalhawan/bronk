# Device groups for the dotfiles' udev rules (IVA-71). systemd-sysusers creates
# them in /etc/group at boot, so `usermod -aG uinput,plugdev $USER` works directly.
#   uinput:  kanata writes to /dev/uinput (99-kanata.rules)
#   plugdev: ZSA Voyager access for Keymapp/Oryx (50-zsa.rules)
g uinput -
g plugdev -
